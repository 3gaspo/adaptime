# =============================================================================
# Dataset Configuration
# =============================================================================
# Format:
# dataset_name/freq:
#   test_length: <int>      # Test set length (shared across all terms)
#   val_length: <int>       # Validation set length (shared across all terms, optional)
#   short:
#     prediction_length: <int>
#   medium:
#     prediction_length: <int>
#   long:
#     prediction_length: <int>
#
# windows and val_windows are automatically calculated, no manual setting required
# windows = floor(test_length / prediction_length)
# val_windows = floor(val_length / prediction_length), or 0 when val_length is 0
# This ensures different terms are evaluated on the same test/val intervals, ensuring fair comparison
# =============================================================================

