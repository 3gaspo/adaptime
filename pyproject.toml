[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "timebench"
version = "0.1.0"
description = "TIME: A Comprehensive Time Series Forecasting Benchmark Framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Zhongzheng Qiao"},
]
keywords = [
    "time series",
    "forecasting",
    "benchmark",
    "evaluation",
    "deep learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "chronos-forecasting==2.3.1",
    "datasets>=2.17.1,<4",
    "einops>=0.8.0,<1",
    "gluonts==0.16.2",
    "huggingface-hub>=1.19.0",
    "numba",
    "numpy>=2.1.3,<2.2",
    "pandas>=2.2.3,<3",
    "pyarrow",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "scikit-learn>=1.8.0,<2",
    "scipy>=1.14.1,<2",
    "statsforecast>=1.7.0,<3",
    "statsmodels",
    "tirex-ts[gluonts,hfdataset]==1.4.2",
    "toolz",
    "torch>=2.5.1,<2.10",
    "tqdm",
    "tsfeatures",
    "tsicl==0.2.1",
]

[project.urls]
Homepage = "https://github.com/zqiao11/TIME"
Repository = "https://github.com/zqiao11/TIME"

[tool.hatch.build.targets.wheel]
packages = ["src/timebench"]

# Include config files in the wheel package
[tool.hatch.build.targets.wheel.force-include]
"src/timebench/config" = "timebench/config"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

# --- Tool Configurations ---

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
